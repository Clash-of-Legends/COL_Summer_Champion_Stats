<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Pick-Ban Statistiky šampionů</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #1e1e2f;
      color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #ffd700;
      margin-bottom: 20px;
    }

    #controls {
      text-align: center;
      margin-bottom: 20px;
    }

    select {
      background-color: #2c2c3c;
      color: #fff;
      padding: 5px 10px;
      border: 1px solid #555;
      border-radius: 5px;
      font-size: 14px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .champ-card {
      background-color: #2c2c3c;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      text-align: center;
      transition: transform 0.2s;
      cursor: pointer;
    }

    .champ-card:hover {
      transform: translateY(-4px);
    }

    .champ-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .champ-name {
      font-weight: bold;
      font-size: 18px;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .champ-info {
      font-size: 14px;
      color: #dddddd;
      margin: 3px 0;
    }

    .highlight {
      color: #ffd700;
      font-weight: bold;
    }

    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      padding: 40px;
    }

    #modal-content {
      background: #2c2c3c;
      padding: 20px;
      border-radius: 12px;
      max-width: 800px;
      margin: auto;
    }

    #modal h2 {
      margin-top: 0;
      color: #ffd700;
    }

    #modal table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    #modal th, #modal td {
      padding: 8px;
      border-bottom: 1px solid #444;
      text-align: left;
    }

    #modal td {
      color: #ccc;
    }

    #modal .close {
      float: right;
      font-size: 18px;
      cursor: pointer;
      color: #aaa;
    }

    #modal .close:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Přehled šampionů (Pick-Ban)</h1>
  <div id="controls">
    <label for="sortSelect">Řadit podle:</label>
    <select id="sortSelect">
      <option value="Picks">Picks</option>
      <option value="Winrate">Winrate</option>
      <option value="Banrate">Banrate</option>
    </select>
  </div>
  <div id="grid">Načítám data...</div>

  <div id="modal">
    <div id="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="modal-title">Zápasy pro: </h2>
      <table id="modal-table">
        <thead>
          <tr><th>Hráč</th><th>Tým</th><th>Enemy</th><th>Výsledek</th><th>K</th><th>D</th><th>A</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
window.onload = async function () {
  const pickBanData = await loadXlsx('League_stats.xlsx', 'Pick-Ban');
  const matchData = await loadXlsx('Stats.xlsx', 'Sheet1');

  parseChampStats(pickBanData);
  parseMatchData(matchData);

  document.getElementById('sortSelect').addEventListener('change', () =>
    renderGrid(document.getElementById('sortSelect').value)
  );

  renderGrid('Picks');
};

let champs = [], matchRows = [];

function loadXlsx(filename, sheetName) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = function (e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const worksheet = workbook.Sheets[sheetName];
      const json = XLSX.utils.sheet_to_json(worksheet); // <--- bez `header: 1`
      resolve(json);
    };
    fetch(filename)
      .then(res => res.blob())
      .then(blob => reader.readAsArrayBuffer(blob));
  });
}


function toStr(val) {
  return (val === undefined || val === null) ? '' : String(val).trim();
}

function parseChampStats(rows) {
  const gamesLine = rows[0];
  const totalGames = toStr(gamesLine[1]) || '?';
  const gameCountElem = document.getElementById('games');
  if (gameCountElem) gameCountElem.textContent = `Počet her: ${totalGames}`;

  const headersRowIndex = rows.findIndex(r => toStr(r[1]) === 'Champ');
  const headers = rows[headersRowIndex].slice(1);
  const dataRows = rows.slice(headersRowIndex + 1);

  champs = [];
  for (const row of dataRows) {
    const cols = row.slice(1);
    if (!cols[0]) continue;
    const champ = Object.fromEntries(headers.map((h, i) => [h, toStr(cols[i])]))

    const champName = champ['Champ'];
    const picks = parseInt(champ['Picks'] || '0');
    const bans = parseInt(champ['Bans'] || '0');

    if (!champName || champName.toLowerCase() === 'undefined' || (picks === 0 && bans === 0)) continue;

    champ['Wins'] = champ['Wins'] === 'undefined' || champ['Wins'] === '' ? '0' : champ['Wins'];
    champ['Loses'] = champ['Loses'] === 'undefined' || champ['Loses'] === '' ? '0' : champ['Loses'];
    champ['Winrate'] = formatPercent100(champ['Winrate']);
    champ['Banrate'] = formatPercent100(champ['Banrate']);

    champs.push(champ);
  }
}

function formatPercent100(val) {
  if (!val || val.includes('undefined')) return '0%';
  const num = parseFloat(val.toString().replace('%', '').replace(',', '.')) || 0;
  return Math.round(num * 100) + '%';
}

function parseMatchData(rows) {
  if (!rows || rows.length === 0) return;

  const champKey = Object.keys(rows[0]).find(k => k.toLowerCase().includes('champ'));
  if (!champKey) {
    console.error("Nenašel jsem sloupec se jmény šampionů!");
    return;
  }

  matchRows = rows.map(row => ({
    champ: toStr(row[champKey]),
    player: toStr(row['Hráč']),
    team: toStr(row['Tým']),
    enemy: toStr(row['Enemy']),
    result: toStr(row['Win/Loss']),
    k: toStr(row['Kills']),
    d: toStr(row['Deaths']),
    a: toStr(row['Assists'])
  }));
}


function renderGrid(sortBy) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const sortValue = val => parseFloat((val || '0').toString().replace('%', '').replace(',', '.')) || 0;
  champs.sort((a, b) => sortValue(b[sortBy]) - sortValue(a[sortBy]));

  for (const champ of champs) {
    const champName = champ['Champ'];
    if (!champName || champName.toLowerCase() === 'undefined') continue;

    const imageUrl = `images/${champName}.jpg`;

    const card = document.createElement('div');
    card.className = 'champ-card';
    card.innerHTML = `
      <img src="${imageUrl}" alt="${champName}" class="champ-img">
      <div class="champ-name">${champName}</div>
      <div class="champ-info highlight">Winrate: ${champ['Winrate']}</div>
      <div class="champ-info">Picks: ${champ['Picks']} | Bans: ${champ['Bans']}</div>
      <div class="champ-info">Wins: ${champ['Wins']} | Loses: ${champ['Loses']}</div>
      <div class="champ-info">Banrate: ${champ['Banrate']}</div>
    `;
    card.addEventListener('click', () => openModal(champName));

    grid.appendChild(card);
  }
}

function openModal(champName) {
  const modal = document.getElementById('modal');
  const title = document.getElementById('modal-title');
  const tbody = document.getElementById('modal-table').querySelector('tbody');

  title.textContent = `Zápasy pro: ${champName}`;
  tbody.innerHTML = '';

  console.log('Porovnávám champName:', champName);
  matchRows.forEach(r => console.log('Záznam champ:', r.champ));

  const filtered = matchRows.filter(m => toStr(m.champ) === toStr(champName));

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Žádná data</td></tr>`;
  } else {
    for (const row of filtered) {
      const tr = document.createElement('tr');
      const resultColor = row.result === 'Win' ? 'limegreen' : 'crimson';
      tr.innerHTML = `
        <td>${row.player}</td>
        <td>${row.team}</td>
        <td>${row.enemy}</td>
        <td style="color:${resultColor}; font-weight:bold;">${row.result}</td>
        <td>${row.k}</td>
        <td>${row.d}</td>
        <td>${row.a}</td>
      `;
      tbody.appendChild(tr);
    }
  }

  modal.style.display = 'block';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
  </script>
</body>
</html>
