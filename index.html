<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Pick-Ban Statistiky šampionů</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #1e1e2f;
      color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #ffd700;
      margin-bottom: 20px;
    }

    #controls {
      text-align: center;
      margin-bottom: 20px;
    }

    select {
      background-color: #2c2c3c;
      color: #fff;
      padding: 5px 10px;
      border: 1px solid #555;
      border-radius: 5px;
      font-size: 14px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .champ-card {
      background-color: #2c2c3c;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      text-align: center;
      transition: transform 0.2s;
      cursor: pointer;
    }

    .champ-card:hover {
      transform: translateY(-4px);
    }

    .champ-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .champ-name {
      font-weight: bold;
      font-size: 18px;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .champ-info {
      font-size: 14px;
      color: #dddddd;
      margin: 3px 0;
    }

    .highlight {
      color: #ffd700;
      font-weight: bold;
    }

    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      padding: 40px;
    }

    #modal-content {
      background: #2c2c3c;
      padding: 20px;
      border-radius: 12px;
      max-width: 800px;
      margin: auto;
    }

    #modal h2 {
      margin-top: 0;
      color: #ffd700;
    }

    #modal table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    #modal th, #modal td {
      padding: 8px;
      border-bottom: 1px solid #444;
      text-align: left;
    }

    #modal td {
      color: #ccc;
    }

    #modal .close {
      float: right;
      font-size: 18px;
      cursor: pointer;
      color: #aaa;
    }

    #modal .close:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Přehled šampionů (Pick-Ban)</h1>
  <div id="controls">
    <label for="sortSelect">Řadit podle:</label>
    <select id="sortSelect">
      <option value="Picks">Picks</option>
      <option value="Winrate">Winrate</option>
      <option value="Banrate">Banrate</option>
    </select>
  </div>
  <div id="grid">Načítám data...</div>

  <div id="modal">
    <div id="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="modal-title">Zápasy pro: </h2>
      <table id="modal-table">
        <thead>
          <tr><th>Hráč</th><th>Tým</th><th>Enemy</th><th>Výsledek</th><th>K</th><th>D</th><th>A</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

 <script>
  // --- obecná helper funkce pro načtení jakéhokoli xlsx souboru + listu ---
  function loadXlsx(url, sheetName) {
    return new Promise(resolve => {
      fetch(url)
        .then(res => res.blob())
        .then(blob => {
          const reader = new FileReader();
          reader.onload = e => {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const ws = wb.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
            resolve(json);
          };
          reader.readAsArrayBuffer(blob);
        });
    });
  }

  window.onload = async function () {
    // načti oba soubory paralelně
    const [pickBanRaw, statsRaw] = await Promise.all([
      loadXlsx('League_stats.xlsx', 'Pick-Ban'),
      loadXlsx('Stats.xlsx', 'Sheet1')
    ]);

    parseChampStats(pickBanRaw);
    parseStats(statsRaw);

    document.getElementById('sortSelect')
      .addEventListener('change', () => renderGrid(document.getElementById('sortSelect').value));

    renderGrid('Picks');
  };

  let champs = [];
  let matchRows = [];

  function toStr(val) {
    return (val===undefined||val===null) ? '' : String(val).trim();
  }

  // --- stávající funkce pro parsování Pick-Ban ---
  function parseChampStats(rows) {
    // ... váš původní kód beze změny ...
  }

  // --- nová funkce pro parsování Stats.xlsx ---
  function parseStats(rows) {
    if (!Array.isArray(rows) || rows.length < 2) {
      console.error('Stats.xlsx: žádná data!');
      return;
    }
    // první řádek = hlavičky, ostatní = data
    const headers = rows[0].map(toStr);
    matchRows = rows.slice(1)
      .filter(r => r.some(c => c !== null && c !== undefined && String(c).trim() !== ''))
      .map(row => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = toStr(row[i]));
        return obj;
      });
    console.log('Načteno záznamů ze Stats.xlsx:', matchRows.length);
  }

  // --- render karet (pick-ban) beze změny, přidá pouze click handler ---
  function renderGrid(sortBy) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const sortValue = v => parseFloat(v.replace('%','').replace(',','.')) || 0;
    champs.sort((a,b) => sortValue(b[sortBy]) - sortValue(a[sortBy]));

    for (const champ of champs) {
      const name = champ['Champ'];
      if (!name) continue;

      const card = document.createElement('div');
      card.className = 'champ-card';
      card.innerHTML = `
        <img src="images/${name}.jpg" class="champ-img" alt="${name}">
        <div class="champ-name">${name}</div>
        <div class="champ-info highlight">Winrate: ${champ['Winrate']}</div>
        <div class="champ-info">Picks: ${champ['Picks']} | Bans: ${champ['Bans']}</div>
        <div class="champ-info">Wins: ${champ['Wins']} | Loses: ${champ['Loses']}</div>
        <div class="champ-info">Banrate: ${champ['Banrate']}</div>
      `;
      card.addEventListener('click', () => openModal(name));
      grid.appendChild(card);
    }
  }

  // --- vlastní modal pro zobrazení řádků ze Stats.xlsx ---
  function openModal(champName) {
    const modal = document.getElementById('modal');
    const title = document.getElementById('modal-title');
    const tbody = document.querySelector('#modal-table tbody');

    title.textContent = `Zápasy pro: ${champName}`;
    tbody.innerHTML = '';

    // filtruj case-insensitive
    const filtered = matchRows.filter(r =>
      toStr(r['Champové']).toLowerCase() === champName.toLowerCase()
    );

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Žádná data</td></tr>`;
    } else {
      for (const r of filtered) {
        const color = r['Win/Loss'] === 'Win' ? 'limegreen' : 'crimson';
        tbody.innerHTML += `
          <tr>
            <td>${r['Hráč']}</td>
            <td>${r['Tým']}</td>
            <td>${r['Enemy']}</td>
            <td style="color:${color}; font-weight:bold;">${r['Win/Loss']}</td>
            <td>${r['Kills']}</td>
            <td>${r['Deaths']}</td>
            <td>${r['Assists']}</td>
          </tr>
        `;
      }
    }

    modal.style.display = 'block';
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }
</script>

</body>
</html>
