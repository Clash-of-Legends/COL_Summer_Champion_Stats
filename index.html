<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Pick-Ban Statistiky šampionů</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family:'Segoe UI',sans-serif; background:#1e1e2f; color:#f0f0f0; margin:0; padding:20px }
    h1 { text-align:center; color:#ffd700; margin-bottom:20px }
    #controls { text-align:center; margin-bottom:20px }
    select { background:#2c2c3c; color:#fff; padding:5px 10px; border:1px solid #555; border-radius:5px }
    #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; max-width:1200px; margin:0 auto }
    .champ-card { background:#2c2c3c; border-radius:12px; padding:14px; box-shadow:0 2px 6px rgba(0,0,0,0.5); text-align:center; cursor:pointer; transition:transform .2s }
    .champ-card:hover { transform:translateY(-4px) }
    .champ-img { width:80px; height:80px; object-fit:contain; margin-bottom:8px }
    .champ-name { font-weight:bold; font-size:18px; margin-bottom:10px }
    .champ-info { font-size:14px; margin:3px 0 }
    .highlight { color:#ffd700; font-weight:bold }
    #modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); padding:40px; z-index:1000 }
    #modal-content { background:#2c2c3c; padding:20px; border-radius:12px; max-width:800px; margin:auto }
    #modal h2 { margin-top:0; color:#ffd700 }
    #modal table { width:100%; border-collapse:collapse; margin-top:10px }
    #modal th, #modal td { padding:8px; border-bottom:1px solid #444; text-align:left }
    #modal td { color:#ccc }
    #modal .close { float:right; font-size:18px; cursor:pointer; color:#aaa }
    #modal .close:hover { color:#fff }
  </style>
</head>
<body>
  <h1>Přehled šampionů (Pick-Ban)</h1>
  <div id="controls">
    <label for="sortSelect">Řadit podle:</label>
    <select id="sortSelect">
      <option value="Picks">Picks</option>
      <option value="Winrate">Winrate</option>
      <option value="Banrate">Banrate</option>
    </select>
  </div>
  <div id="grid">Načítám data…</div>

  <div id="modal">
    <div id="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="modal-title"></h2>
      <table id="modal-table">
        <thead>
          <tr>
            <th>Hráč</th><th>Tým</th><th>Enemy</th>
            <th>Výsledek</th><th>K</th><th>D</th><th>A</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    // pomocné funkce
    function toStr(v){ return v==null?'':String(v).trim(); }
    function formatPercent100(val){
      if(!val||val.includes('undefined')) return '0%';
      const n = parseFloat(val.replace('%','').replace(',','.')||'0')||0;
      return Math.round(n*100) + '%';
    }

    // načtení XLSX listu
    function loadXlsx(url, sheetName) {
      return fetch(url)
        .then(res => {
          if (!res.ok) throw new Error(`Fetch ${url} selhal: ${res.status}`);
          return res.blob();
        })
        .then(blob => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => {
            try {
              const data = new Uint8Array(e.target.result);
              const wb = XLSX.read(data, { type: 'array' });
              const ws = wb.Sheets[sheetName];
              if (!ws) throw new Error(`List "${sheetName}" neexistuje v ${url}`);
              const arr = XLSX.utils.sheet_to_json(ws, { header: 1 });
              resolve(arr);
            } catch (err) {
              reject(err);
            }
          };
          reader.onerror = reject;
          reader.readAsArrayBuffer(blob);
        }));
    }

    let champs = [], matchRows = [];

    window.onload = async () => {
      try {
        const [pbRaw, stRaw] = await Promise.all([
          loadXlsx('League_stats.xlsx', 'Pick-Ban'),
          loadXlsx('Stats.xlsx',       'List1')
        ]);
        parseChampStats(pbRaw);
        parseStats(stRaw);

        document.getElementById('sortSelect')
          .addEventListener('change', () => renderGrid(document.getElementById('sortSelect').value));

        renderGrid('Picks');
      } catch (e) {
        console.error(e);
        alert('Chyba při načítání dat: ' + e.message);
      }
    };

    // parsování Pick-Ban dat
    function parseChampStats(rows) {
      const hdrIdx = rows.findIndex(r => toStr(r[1]) === 'Champ');
      if (hdrIdx < 0) { console.error('Pick-Ban: nenalezen sloupec Champ'); return; }
      const headers = rows[hdrIdx].slice(1);
      champs = rows.slice(hdrIdx + 1).map(r => {
        const vals = r.slice(1);
        if (!vals[0]) return null;
        const o = Object.fromEntries(headers.map((h,i)=>[h, toStr(vals[i])]));
        const p = parseInt(o.Picks||'0',10), b = parseInt(o.Bans||'0',10);
        if (!o.Champ || (p===0&&b===0)) return null;
        o.Wins    = (o.Wins==='undefined'||!o.Wins)?'0':o.Wins;
        o.Loses   = (o.Loses==='undefined'||!o.Loses)?'0':o.Loses;
        o.Winrate = formatPercent100(o.Winrate);
        o.Banrate = formatPercent100(o.Banrate);
        return o;
      }).filter(Boolean);
    }

    // parsování detailních zápasů
    function parseStats(rows) {
      const hdr = rows[0].map(h=>toStr(h).toLowerCase());
      const champI = hdr.findIndex(h=>h.startsWith('champ'));
      const hracI  = hdr.findIndex(h=>h.includes('hráč')||h.includes('player'));
      const tymI   = hdr.findIndex(h=>h.includes('tým')   ||h.includes('team'));
      const eneI   = hdr.findIndex(h=>h.includes('enemy'));
      const resI   = hdr.findIndex(h=>h.includes('win/loss')||h.includes('winloss'));
      const kI     = hdr.findIndex(h=>h.includes('kills'));
      const dI     = hdr.findIndex(h=>h.includes('deaths'));
      const aI     = hdr.findIndex(h=>h.includes('assists'));

      matchRows = rows.slice(1).map(r=>({
        champ:   toStr(r[champI]),
        hrac:    toStr(r[hracI]),
        tym:     toStr(r[tymI]),
        enemy:   toStr(r[eneI]),
        winloss: toStr(r[resI]),
        kills:   toStr(r[kI]),
        deaths:  toStr(r[dI]),
        assists: toStr(r[aI])
      })).filter(r=>r.champ);
      console.log('Stats načteno:', matchRows.length);
    }

    // vykreslení gridu
    function renderGrid(sortBy) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const sv = v => parseFloat(v.replace('%','').replace(',','.'))||0;
      champs.sort((a,b)=> sv(b[sortBy]) - sv(a[sortBy]));
      for (const c of champs) {
        const name = c.Champ;
        const card = document.createElement('div');
        card.className = 'champ-card';
        card.innerHTML = `
          <img src="images/${name}.jpg" class="champ-img" alt="${name}">
          <div class="champ-name">${name}</div>
          <div class="champ-info highlight">Winrate: ${c.Winrate}</div>
          <div class="champ-info">Picks: ${c.Picks} | Bans: ${c.Bans}</div>
          <div class="champ-info">Wins: ${c.Wins} | Loses: ${c.Loses}</div>
          <div class="champ-info">Banrate: ${c.Banrate}</div>
        `;
        card.addEventListener('click', () => openModal(name));
        grid.appendChild(card);
      }
    }

    // otevření modalu
    function openModal(name) {
      const modal = document.getElementById('modal');
      const title = document.getElementById('modal-title');
      const tbody = document.querySelector('#modal-table tbody');
      tbody.innerHTML = '';
      title.textContent = `Zápasy pro: ${name}`;

      const rows = matchRows.filter(r => r.champ.toLowerCase() === name.toLowerCase());
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center">Žádná data</td></tr>`;
      } else {
        for (const r of rows) {
          const col = r.winloss.toLowerCase().includes('win') ? 'limegreen' : 'crimson';
          tbody.innerHTML += `
            <tr>
              <td>${r.hrac}</td>
              <td>${r.tym}</td>
              <td>${r.enemy}</td>
              <td style="color:${col};font-weight:bold">${r.winloss}</td>
              <td>${r.kills}</td>
              <td>${r.deaths}</td>
              <td>${r.assists}</td>
            </tr>`;
        }
      }

      modal.style.display = 'block';
    }
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
